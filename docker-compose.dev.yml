# Desenvolvimento local com PostgreSQL no Docker (opcional)
# Subir: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile local-db up --build -d

services:
  db:
    profiles:
      - local-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartag
      POSTGRES_PASSWORD: smartag
      POSTGRES_DB: smartag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartag -d smartag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    environment:
      EXTERNAL_DATABASE_URL: postgresql://smartag:smartag@db:5432/smartag?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-smartag-docker-dev-secret}
    depends_on:
      db:
        condition: service_healthy
        required: false

  seed:
    environment:
      EXTERNAL_DATABASE_URL: postgresql://smartag:smartag@db:5432/smartag?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  postgres_data:
