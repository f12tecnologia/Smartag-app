# Produção / VPS: usa variáveis do arquivo .env (EXTERNAL_DATABASE_URL, SESSION_SECRET, etc.)
# Subir: docker compose up --build -d
# Seed admin: docker compose --profile seed run --rm seed

services:
  app:
    build: .
    ports:
      - "${PORT:-3002}:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  seed:
    build: .
    profiles:
      - seed
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "tools/seed-superadmin.js"]
    restart: "no"
