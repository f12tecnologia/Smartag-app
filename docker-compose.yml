services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartag
      POSTGRES_PASSWORD: smartag
      POSTGRES_DB: smartag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartag -d smartag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3002:3002"
    environment:
      EXTERNAL_DATABASE_URL: postgresql://smartag:smartag@db:5432/smartag?sslmode=disable
      SESSION_SECRET: smartag-docker-dev-secret
      NODE_ENV: production
      PORT: 3002
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    profiles:
      - seed
    environment:
      EXTERNAL_DATABASE_URL: postgresql://smartag:smartag@db:5432/smartag?sslmode=disable
      SESSION_SECRET: smartag-docker-dev-secret
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "tools/seed-admin.js"]
    restart: "no"

volumes:
  postgres_data:
